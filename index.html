<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霍兰德职业兴趣测试 (二选一版 · 60题)</title>
    <style>
        /* --- 全局样式 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 40px 35px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .subhead {
            color: #4a5568;
            font-size: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .subhead strong { color: #2b6cb0; }
        .question-item {
            background: #f7fafc;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 16px;
            border: 1px solid #edf2f7;
            transition: background 0.15s;
        }
        .question-item:hover { background: #edf2f7; }
        .question-number {
            font-weight: 600;
            color: #4a5568;
            margin-right: 6px;
        }
        .question-prompt {
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .options button {
            flex: 1 1 45%;
            padding: 10px 18px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #2d3748;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 160px;
        }
        .options button .dimension-tag {
            display: inline-block;
            background: #e2e8f0;
            border-radius: 20px;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 700;
            color: #2d3748;
            margin-right: 4px;
        }
        .options button:hover { background: #edf2f7; border-color: #cbd5e0; }
        .options button.selected {
            background: #2b6cb0;
            border-color: #2b6cb0;
            color: white;
        }
        .options button.selected .dimension-tag {
            background: #ffffff80;
            color: #1a202c;
        }
        .progress-section {
            margin: 30px 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }
        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 40px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #2b6cb0;
            border-radius: 40px;
            transition: width 0.25s ease;
        }
        .progress-text {
            font-size: 15px;
            font-weight: 500;
            color: #2d3748;
            white-space: nowrap;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
        }
        .actions .left-buttons { display: flex; gap: 12px; }
        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            background: #edf2f7;
            color: #2d3748;
        }
        .btn-primary {
            background: #2b6cb0;
            color: white;
            box-shadow: 0 4px 12px rgba(43,108,176,0.25);
        }
        .btn-primary:hover { background: #1a4f8b; transform: translateY(-1px); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #38a169;
            color: white;
            box-shadow: 0 4px 12px rgba(56,161,105,0.25);
        }
        .btn-success:hover { background: #2f855a; transform: translateY(-1px); }
        .btn-outline {
            background: transparent;
            border: 2px solid #cbd5e0;
        }
        .btn-outline:hover { background: #edf2f7; }
        #resultArea {
            margin-top: 28px;
            padding: 24px 28px;
            border-radius: 20px;
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            display: none;
        }
        #resultArea.show { display: block; }
        #resultArea h3 {
            font-size: 22px;
            color: #2b6cb0;
            margin-bottom: 6px;
        }
        #resultArea .code-badge {
            display: inline-block;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            background: #2b6cb0;
            color: white;
            padding: 6px 28px;
            border-radius: 60px;
            margin: 10px 0 12px;
        }
        #resultArea .detail {
            color: #2d3748;
            font-size: 15px;
            line-height: 1.7;
        }
        #resultArea .status-msg {
            margin-top: 12px;
            font-weight: 500;
            color: #2b6cb0;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 14px;
            color: #718096;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        @media (max-width: 640px) {
            .container { padding: 20px 16px; }
            .options button { flex: 1 1 100%; }
            .actions { flex-direction: column; align-items: stretch; }
            .actions .left-buttons { justify-content: center; }
            .btn { width: 100%; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🧭 霍兰德职业兴趣测试</h1>
    <div class="subhead">
        共 60 题 · 每题从两个描述中选出更符合您的一项 · 凭第一感觉作答<br>
        每个选项对应的霍兰德类型已标注，请放心选择，无对错之分。
    </div>

    <!-- 题目列表容器 -->
    <div id="questionsContainer"></div>

    <!-- 进度条 -->
    <div class="progress-section">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 60</span>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
        <div class="left-buttons">
            <button class="btn btn-outline" id="resetBtn">🔄 重新测试</button>
        </div>
        <div>
            <button class="btn btn-primary" id="submitBtn" disabled>📤 提交结果</button>
        </div>
    </div>

    <!-- 结果显示区 -->
    <div id="resultArea">
        <h3>✨ 您的霍兰德代码</h3>
        <div class="code-badge" id="resultCode">---</div>
        <div class="detail" id="resultDetail"></div>
        <div class="status-msg" id="resultStatus"></div>
    </div>
    <div class="footer-note">
        全部完成后点击 “提交结果” 将自动发送至 Dify Webhook
    </div>
</div>

<script>
    (function() {
        // ---------- ★ 已替换为 corsproxy.io 代理地址 ★ ----------
        const WEBHOOK_URL = 'https://corsproxy.io/?https://trigger.ai-plugin.io/triggers/webhook/WYTqaJV7imd4U1Svlb86MX79';
        // -------------------------------------------------------------

        // ----- 获取 URL 中的 session 参数（用于关联用户） -----
        const urlParams = new URLSearchParams(window.location.search);
        const SESSION_ID = urlParams.get('session') || 'default-session';

        // ----- 1. 定义六个维度的描述（每个维度10句，来自原有题库） -----
        const DIMENSION_DESCRIPTIONS = {
            'R': [  // 现实型
                "喜欢动手修理东西",
                "喜欢户外工作",
                "喜欢操作机械、工具",
                "喜欢做体力或实操性工作",
                "喜欢运动、体能类活动",
                "喜欢种植、养殖、手工",
                "喜欢结构清晰、实际可操作的事",
                "不喜欢整天坐在办公室",
                "喜欢具体、看得见成果的工作",
                "擅长动手解决问题"
            ],
            'I': [  // 研究型
                "喜欢思考、分析问题",
                "喜欢研究原理、规律",
                "喜欢阅读、学习新知识",
                "喜欢探索未知、解决难题",
                "喜欢观察、总结、归纳",
                "喜欢数据、逻辑推理",
                "喜欢独立思考，不喜欢被打扰",
                "喜欢探究事情为什么会发生",
                "喜欢写分析、研究报告",
                "对事物背后的逻辑很感兴趣"
            ],
            'A': [  // 艺术型
                "喜欢创意、设计",
                "喜欢音乐、美术、写作",
                "喜欢自由、不喜欢死板规则",
                "喜欢表达自我、展现个性",
                "喜欢美感、氛围、情调",
                "想象力丰富",
                "喜欢新鲜、变化、不重复的工作",
                "情绪感受力强",
                "喜欢独特、与众不同",
                "不喜欢被条条框框限制"
            ],
            'S': [  // 社会型
                "喜欢帮助别人",
                "喜欢倾听、安慰他人",
                "喜欢教育、指导、培训",
                "喜欢与人打交道、建立关系",
                "喜欢团队合作、和谐氛围",
                "善于理解他人感受",
                "喜欢公益、服务类工作",
                "愿意为他人付出",
                "善于沟通、化解矛盾",
                "喜欢关心、照顾他人"
            ],
            'E': [  // 企业型
                "喜欢影响、说服他人",
                "喜欢管理、领导团队",
                "喜欢竞争、挑战目标",
                "喜欢承担责任、做决策",
                "喜欢组织、统筹安排",
                "喜欢权力、地位、成就感",
                "敢于表达、敢于担当",
                "喜欢创业、开拓、进取",
                "喜欢推动事情、掌控进度",
                "喜欢与人谈判、争取资源"
            ],
            'C': [  // 常规型
                "喜欢稳定、规律的工作",
                "喜欢流程、制度、规则",
                "喜欢数据、档案、表格",
                "喜欢整洁、有序、规范",
                "喜欢细致、准确、不出错",
                "喜欢按部就班、不喜欢变动",
                "善于处理文字、资料",
                "喜欢可预期、安稳的环境",
                "做事严谨、有耐心",
                "遵守纪律、重视规则"
            ]
        };

        const DIMENSION_ORDER = ['R', 'I', 'A', 'S', 'E', 'C'];
        const DIMENSION_FULL = {
            'R': '现实型', 'I': '研究型', 'A': '艺术型',
            'S': '社会型', 'E': '企业型', 'C': '常规型'
        };

        // ----- 2. 生成60个题目（每对维度组合4题） -----
        function generateQuestions() {
            const questions = [];
            // 生成所有维度对（共15对）
            const pairs = [];
            for (let i = 0; i < DIMENSION_ORDER.length; i++) {
                for (let j = i + 1; j < DIMENSION_ORDER.length; j++) {
                    pairs.push([DIMENSION_ORDER[i], DIMENSION_ORDER[j]]);
                }
            }

            // 每个维度对生成4题，循环使用描述
            for (const [dimA, dimB] of pairs) {
                const descA = DIMENSION_DESCRIPTIONS[dimA];
                const descB = DIMENSION_DESCRIPTIONS[dimB];
                // 使用索引偏移，使每个描述被均衡使用
                // 此处简单按顺序取，不同对之间会重复，但整体每个维度出现次数相等
                for (let k = 0; k < 4; k++) {
                    const idxA = k % descA.length;
                    const idxB = k % descB.length;
                    questions.push({
                        textA: descA[idxA],
                        dimA: dimA,
                        textB: descB[idxB],
                        dimB: dimB
                    });
                }
            }
            // 打乱顺序，避免维度对集中出现
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            return questions;
        }

        const QUESTIONS = generateQuestions(); // 长度为60

        // ----- 3. 状态 -----
        let answers = new Array(60).fill(null); // 存储选中的维度字母 (如 'R')
        let isSubmitted = false;

        // ----- DOM 引用 -----
        const container = document.getElementById('questionsContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultArea = document.getElementById('resultArea');
        const resultCode = document.getElementById('resultCode');
        const resultDetail = document.getElementById('resultDetail');
        const resultStatus = document.getElementById('resultStatus');

        // ----- 渲染题目 -----
        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, index) => {
                const selected = answers[index];
                const isSelectedA = (selected === q.dimA);
                const isSelectedB = (selected === q.dimB);
                html += `
                    <div class="question-item" data-index="${index}">
                        <div class="question-number">${index + 1}.</div>
                        <div class="question-prompt">您更倾向于：</div>
                        <div class="options">
                            <button class="${isSelectedA ? 'selected' : ''}" 
                                    data-index="${index}" data-dim="${q.dimA}">
                                <span class="dimension-tag">${q.dimA}</span> ${q.textA}
                            </button>
                            <button class="${isSelectedB ? 'selected' : ''}" 
                                    data-index="${index}" data-dim="${q.dimB}">
                                <span class="dimension-tag">${q.dimB}</span> ${q.textB}
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateProgress();
            updateSubmitButton();
        }

        // ----- 更新进度 -----
        function updateProgress() {
            const answered = answers.filter(v => v !== null).length;
            const pct = Math.round((answered / 60) * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = `${answered} / 60`;
        }

        // ----- 更新提交按钮状态 -----
        function updateSubmitButton() {
            const allAnswered = answers.every(v => v !== null);
            submitBtn.disabled = !allAnswered || isSubmitted;
        }

        // ----- 计算霍兰德代码 -----
        function calculateHollandCode() {
            const scoreMap = { 'R': 0, 'I': 0, 'A': 0, 'S': 0, 'E': 0, 'C': 0 };
            for (const dim of answers) {
                if (dim) scoreMap[dim] += 1;
            }
            // 按得分降序排序
            const sorted = DIMENSION_ORDER.slice().sort((a, b) => scoreMap[b] - scoreMap[a]);
            const top3 = sorted.slice(0, 3);
            const code = top3.join('');
            const details = top3.map(d => `${d} (${DIMENSION_FULL[d]}: ${scoreMap[d]}分)`).join('、');
            return { code, details, scores: scoreMap };
        }

        // ----- 显示结果 -----
        function displayResult() {
            const { code, details, scores } = calculateHollandCode();
            resultCode.textContent = code;
            resultDetail.innerHTML = `<strong>各维度得分：</strong> ${details}`;
            resultArea.classList.add('show');
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return { code, details, scores };
        }

        // ----- 发送结果到 Dify Webhook -----
        async function sendToDify(code, scores) {
            const payload = {
                session_id: SESSION_ID,
                holland_code: code,
                scores: scores,
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    mode: 'cors',
                    credentials: 'omit'
                });
                if (response.ok) {
                    resultStatus.textContent = '✅ 结果已成功发送至 Dify！';
                    resultStatus.style.color = '#38a169';
                } else {
                    const errorText = await response.text();
                    resultStatus.textContent = `⚠️ 发送失败 (HTTP ${response.status})：${errorText}`;
                    resultStatus.style.color = '#e53e3e';
                }
            } catch (err) {
                resultStatus.textContent = `❌ 网络错误：${err.message}`;
                resultStatus.style.color = '#e53e3e';
            }
        }

        // ----- 事件绑定 (委托) -----
        container.addEventListener('click', function(e) {
            const btn = e.target.closest('button[data-index]');
            if (!btn) return;
            if (isSubmitted) return;

            const index = parseInt(btn.dataset.index, 10);
            const dim = btn.dataset.dim;

            if (answers[index] === dim) {
                answers[index] = null;
            } else {
                answers[index] = dim;
            }

            const item = btn.closest('.question-item');
            const btns = item.querySelectorAll('button[data-index]');
            btns.forEach(b => {
                const d = b.dataset.dim;
                if (answers[index] === d) {
                    b.classList.add('selected');
                } else {
                    b.classList.remove('selected');
                }
            });

            updateProgress();
            updateSubmitButton();
        });

        // ----- 提交按钮 -----
        submitBtn.addEventListener('click', async function() {
            if (isSubmitted) return;
            if (!answers.every(v => v !== null)) {
                alert('请完成全部 60 道题后再提交。');
                return;
            }
            isSubmitted = true;
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ 提交中...';

            const { code, scores } = displayResult();

            if (WEBHOOK_URL && WEBHOOK_URL !== 'https://your-dify-instance/webhook/your-unique-id') {
                await sendToDify(code, scores);
            } else {
                resultStatus.textContent = 'ℹ️ 请先配置 WEBHOOK_URL 再提交。';
                resultStatus.style.color = '#d69e2e';
            }

            submitBtn.textContent = '✅ 已提交';
        });

        // ----- 重置按钮 -----
        resetBtn.addEventListener('click', function() {
            if (isSubmitted) {
                if (!confirm('重新测试将清除当前结果，确定继续吗？')) return;
            }
            answers = new Array(60).fill(null);
            isSubmitted = false;
            resultArea.classList.remove('show');
            resultStatus.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = '📤 提交结果';
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ----- 初始化渲染 -----
        renderQuestions();
    })();
</script>
</body>
</html>
